version: 2
updates:
  # Keep SHA-pinned GitHub Actions current. Dependabot bumps the pinned commit
  # and updates the trailing `# vX.Y.Z` comment. Grouped into a single weekly PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # changesets/action v2 renamed its inputs (version-script, publish-script,
      # github-token), requires Changesets CLI v3 and pushes via the GitHub API.
      # Hold at v1 until the CLI v3 migration PR; mirrors zerodev-data-api.
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
