name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome CI
        run: pnpm run ci

      # Fail fast if a publishable package lacks a repository field — npm's
      # provenance check would otherwise reject the publish with E422.
      - name: Check publishable packages
        run: node scripts/check-publishable.mjs

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run type check
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Packaging smoke test: confirm each publishable package can be packed
      # (catches missing dist / bad `files` / `exports` before release).
      - name: Verify packaging (npm pack --dry-run)
        run: |
          for d in $(node scripts/check-publishable.mjs --list); do
            echo "::group::npm pack $d"
            ( cd "$d" && npm pack --dry-run --ignore-scripts )
            echo "::endgroup::"
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  backend-e2e-test:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    # Needs the staging secrets, so skip wherever they are unavailable:
    #   - PRs from forks — fork `pull_request` runs get no repository secrets.
    #   - Dependabot PRs — reads the separate Dependabot secrets store which does not exist.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository
       && github.actor != 'dependabot[bot]')
    needs: [build]
    concurrency:
      group: integration-tests-staging
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend e2e tests
        run: pnpm test:e2e:backend
        env:
          ZD_PROJECT_ID: ${{ secrets.ZD_PROJECT_ID }}
          ZD_OTP_PROJECT_ID: ${{ secrets.ZD_OTP_PROJECT_ID }}

  e2e-test:
    name: Browser E2E Tests
    runs-on: ubuntu-latest
    # Needs the staging secrets, so skip wherever they are unavailable:
    #   - PRs from forks — fork `pull_request` runs get no repository secrets.
    #   - Dependabot PRs — reads the separate Dependabot secrets store which does not exist.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository
       && github.actor != 'dependabot[bot]')
    needs: [build]
    concurrency:
      group: e2e-tests-staging
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo SDK dependencies
        run: pnpm build:e2e

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and start QA lab
        working-directory: apps/qa-lab-testing
        run: |
          pnpm build
          pnpm start &
        env:
          # Both ids are inlined so a URL param can select the flavor per test,
          # instead of building the app twice as the signer demo does.
          NEXT_PUBLIC_ZD_PROJECT_ID: ${{ secrets.ZD_PROJECT_ID }}
          NEXT_PUBLIC_ZD_OTP_PROJECT_ID: ${{ secrets.ZD_OTP_PROJECT_ID }}
          NEXT_PUBLIC_KMS_PROXY_BASE_URL: https://kms.staging.zerodev.app/api/v1
          # Pin the bundler/paymaster to staging so the AA stack matches the
          # staging KMS above (the SDK default host is prod).
          NEXT_PUBLIC_ZERODEV_AA_HOST: https://staging-meta-aa-provider.onrender.com

      - name: Wait for QA lab
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "QA lab is ready"
              exit 0
            fi
            echo "Waiting for QA lab... ($i/15)"
            sleep 2
          done
          echo "QA lab failed to start"
          exit 1

      - name: Run E2E tests
        run: pnpm exec playwright test --config e2e/playwright.config.ts
        env:
          LAB_APP_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  ci-gate:
    name: All checks passed
    runs-on: ubuntu-latest
    needs:
      - lint-and-format
      - typecheck
      - build
      - test
      - backend-e2e-test
      - e2e-test
    if: always()
    steps:
      - name: Verify every job succeeded
        env:
          # Every job in `needs:` and its result, so this script never has to
          # name them. Adding or removing a gated job is a one-line edit to
          # `needs:` above and nothing else.
          NEEDS: ${{ toJSON(needs) }}
          # The ONLY per-job policy: jobs allowed to report `skipped`. Both are
          # guarded off for PRs from forks, so a fork PR could never merge otherwise.
          # Any other job that reports `skipped` fails the gate — a skip there
          # means it silently did not run.
          SKIPPABLE: backend-e2e-test e2e-test
        run: |
          fail=0

          # `jq` is preinstalled on GitHub-hosted ubuntu runners.
          while read -r job result; do
            case "$result" in
              success)
                echo "ok       $job"
                ;;
              skipped)
                case " $SKIPPABLE " in
                  *" $job "*)
                    echo "skipped  $job (allowed: guarded off for fork PRs)"
                    ;;
                  *)
                    echo "::error::$job was skipped but is not allowed to skip"
                    fail=1
                    ;;
                esac
                ;;
              *)
                echo "::error::$job did not succeed (got '$result')"
                fail=1
                ;;
            esac
          done <<EOF
          $(echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"')
          EOF

          if [ "$fail" -ne 0 ]; then
            echo "::error::CI gate failed — see the job results above."
            exit 1
          fi
          echo "All gated jobs passed."
