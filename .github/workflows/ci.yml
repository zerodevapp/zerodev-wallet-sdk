name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new commit on a PR cancels its run in flight. Each push to main or develop
# gets its own group (its run id), so no push is ever cancelled; the live e2e
# suites still queue one at a time on their own groups.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci-jobs.yml
    secrets: inherit

  # The required check. It stays in this file because a job inside a called
  # workflow reports as "<caller> / <job>", which would rename the check. It
  # reads the inner gate's output rather than the call's result, because the
  # result GitHub reports for a call with allowed skips inside is undocumented.
  ci-gate:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    steps:
      - name: Verify the CI jobs succeeded
        env:
          PASSED: ${{ needs.ci.outputs.passed }}
          RESULT: ${{ needs.ci.result }}
        run: |
          if [ "$PASSED" != "true" ]; then
            echo "::error::CI jobs did not pass (call ended '$RESULT')"
            exit 1
          fi
