name: Backend E2E

# The backend e2e suite, callable from any repo in the org.
#
# One job, no internal `if:`. A caller job that reports `skipped` was skipped by
# its own guard, never by something in here — which is what lets `ci-gate`
# treat a skip as meaningful.
#
# `workflow_call` only: a workflow that is both called and self-triggered
# resolves `secrets.*` differently depending on how it started.
on:
  workflow_call:
    inputs:
      kms_url:
        description: The KMS the suite runs against. Blank means staging.
        type: string
        required: false
      # No aa_host: this suite signs userOps at the KMS and never submits one,
      # so no bundler or paymaster is used
      job_name:
        description: >-
          Display name for the job. A calling repo sees it as
          "<its own job name> / <this>", so it can set wording that reads in
          its own Actions tab.
        type: string
        required: false
      ref:
        description: Debug escape hatch. Blank pins the tests to this workflow's commit.
        type: string
        required: false
    secrets:
      ZD_PROJECT_ID:
        required: true
      ZD_OTP_PROJECT_ID:
        required: true
      MAILOSAUR_API_KEY:
        required: true
      MAILOSAUR_SERVER_ID:
        required: true


jobs:
  backend-e2e:
    name: ${{ inputs.job_name || 'Backend E2E Tests' }}
    runs-on: ubuntu-latest
    # Serializes runs against one staging. Groups are scoped to the caller's
    # repo, so two different repos calling this can still collide.
    concurrency:
      group: integration-tests-staging
      queue: max
    # Resolve KMS url
    env:
      KMS_URL: ${{ inputs.kms_url || 'https://kms.staging.zerodev.app/api/v1' }}
    steps:
      # Debugging print to help further diagnosis
      - name: Show target
        run: |
          echo "- KMS: $KMS_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the tests
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # A called workflow checks out the CALLER's repo by default. These
          # two pin the tests to this workflow file's own commit, so a caller
          # on `@v1.2.0` gets that tag's tests.
          #
          # `job` context, not `github`: `github.job_workflow_sha` is an OIDC
          # claim that evaluates to empty here and silently checks out the
          # default branch. Public repo, so GITHUB_TOKEN is enough.
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.ref || job.workflow_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend e2e tests
        run: pnpm test:e2e:backend
        env:
          ZD_PROJECT_ID: ${{ secrets.ZD_PROJECT_ID }}
          ZD_OTP_PROJECT_ID: ${{ secrets.ZD_OTP_PROJECT_ID }}
          KMS_BACKEND_URL: ${{ env.KMS_URL }}
          MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
          MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}

