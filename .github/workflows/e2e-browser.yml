name: Browser E2E

# The browser e2e suite, callable from any repo in the org.
#
# One job, no internal `if:`. A caller job that reports `skipped` was skipped by
# its own guard, never by something in here — which is what lets `ci-gate`
# treat a skip as meaningful.
#
# `workflow_call` only: a workflow that is both called and self-triggered
# resolves `secrets.*` differently depending on how it started.
on:
  workflow_call:
    inputs:
      kms_url:
        description: The KMS the suite runs against. Blank means staging.
        type: string
        required: false
      aa_host:
        description: >-
          Bundler and paymaster host. Blank means staging. Must match kms_url —
          moving one and not the other fails in ways that look like SDK bugs.
        type: string
        required: false
      job_name:
        description: >-
          Display name for the job. A calling repo sees it as
          "<its own job name> / <this>", so it can set wording that reads in
          its own Actions tab.
        type: string
        required: false
    secrets:
      ZD_PROJECT_ID:
        required: true
      ZD_OTP_PROJECT_ID:
        required: true
      MAILOSAUR_API_KEY:
        required: true
      MAILOSAUR_SERVER_ID:
        required: true
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:
        required: true

permissions:
  contents: read

jobs:
  browser-e2e:
    name: ${{ inputs.job_name || 'Browser E2E Tests' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # Without this a container gets Docker's 64MB /dev/shm against a host runner's
      # ~8GB, and Chromium aborts navigations once it runs out.
      options: --ipc=host
    defaults:
      run:
        shell: bash
    # Serializes runs against the same KMS. The fallback repeats the staging URL
    # instead of a short label, so a blank input and an explicit staging URL land
    # in one group. `env` is not available in `concurrency`, hence the repeat.
    # Groups are per calling repo, so two repos calling this still collide.
    concurrency:
      group: e2e-tests-${{ inputs.kms_url || 'https://kms.staging.zerodev.app/api/v1' }}
      queue: max
    # Resolve KMS and AA_HOST url
    env:
      KMS_URL: ${{ inputs.kms_url || 'https://kms.staging.zerodev.app/api/v1' }}
      AA_HOST: ${{ inputs.aa_host || 'https://staging-meta-aa-provider.onrender.com' }}
    steps:
      - name: Check out the tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}

      - name: Show target
        run: |
          set -euo pipefail
          echo "- KMS: $KMS_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- AA host: $AA_HOST" >> "$GITHUB_STEP_SUMMARY"
          sha=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
          echo "- Tests: $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the image matches the lockfile
        id: image-check
        run: |
          set -euo pipefail
          version=$(pnpm exec playwright --version | awk '{print $2}')
          if [ -z "$version" ]; then
            echo "::error::could not read the Playwright version"
            exit 1
          fi

          # Capture, then assert a row parsed, then iterate. A command that fails inside
          # a `for $(...)` word list trips neither `set -e` nor pipefail: the loop runs
          # zero times and the guard passes, which is worse than having no guard.
          dry_run=$(pnpm exec playwright install --dry-run chromium)
          paths=$(printf '%s\n' "$dry_run" | awk '/Install location:/{print $3}')
          count=$(printf '%s\n' "$paths" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::parsed no install locations from 'playwright install --dry-run'; its output format has changed and this guard needs updating"
            printf '%s\n' "$dry_run"
            exit 1
          fi

          missing=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if [ -d "$path" ]; then
              echo "ok: $path"
            else
              echo "missing: $path"
              missing=1
            fi
          done <<< "$paths"

          if [ "$missing" -ne 0 ]; then
            echo "::error::@playwright/test is ${version}, but the container image does not carry all of its browser builds. Bump the container tag in this workflow to v${version}-noble."
            exit 1
          fi
          echo "Playwright ${version}: all ${count} browser paths present."
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install unzip
        run: |
          set -euo pipefail
          # The image ships tar and gzip but no unzip, and the MetaMask fixture unpacks
          # a .zip
          apt-get update -qq
          apt-get install -y --no-install-recommends unzip
          command -v unzip

      - name: Build demo SDK dependencies
        run: pnpm build:e2e

      - name: Cache browser e2e fixtures
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: e2e/.cache
          key: e2e-fixtures-${{ runner.os }}-pw${{ steps.image-check.outputs.version }}-${{ hashFiles('e2e/helpers/wallet-versions.ts') }}

      - name: Build and start QA lab
        working-directory: apps/qa-lab-testing
        run: |
          pnpm build
          pnpm start > "$GITHUB_WORKSPACE/qa-lab.log" 2>&1 &
        env:
          # Both ids are inlined so a URL param can select the flavor per test,
          # instead of building the app twice as the signer demo does.
          NEXT_PUBLIC_ZD_PROJECT_ID: ${{ secrets.ZD_PROJECT_ID }}
          NEXT_PUBLIC_ZD_OTP_PROJECT_ID: ${{ secrets.ZD_OTP_PROJECT_ID }}
          # Next inlines these at BUILD time, so an override has to be set here
          # rather than on the test step.
          NEXT_PUBLIC_KMS_PROXY_BASE_URL: ${{ env.KMS_URL }}
          NEXT_PUBLIC_ZERODEV_AA_HOST: ${{ env.AA_HOST }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}

      - name: Wait for QA lab
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "QA lab is ready"
              exit 0
            fi
            echo "Waiting for QA lab... ($i/15)"
            sleep 2
          done
          echo "QA lab failed to start"
          exit 1

      - name: Run E2E tests
        run: pnpm exec playwright test --config e2e/playwright.config.ts
        env:
          LAB_APP_URL: http://localhost:3000
          MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
          MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}


      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-${{ github.job }}
          path: playwright-report/
          retention-days: 14

      - name: Upload QA lab logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qa-lab-log-${{ github.job }}
          path: qa-lab.log
          if-no-files-found: warn
          retention-days: 14
