packages:
  - 'packages/*'
  - 'apps/*'

# One viem across the workspace, so every @wagmi/core peer-resolves to the
# same instance (two instances make their types unrelated and break app
# typechecks). Ceiling: @wagmi/core@3.6.0 imports viem/tempo APIs removed in
# 2.55.7 (zone.getDepositStatus) and 2.56.0 (the ./tempo/zones export).
# Floor: @zerodev/smart-routing-address@1.x needs >=2.55 (robinhood chain).
# Scoped to our declared range so WalletConnect's pinned viem@2.23.2 chain
# is left alone. Raise when wagmi supports viem >=2.56.
overrides:
  'viem@^2.47.18': 2.55.5

# Security: Only install packages that are at least 24 hours old (1440 minutes)
# This helps protect against typosquatting and malicious packages
minimumReleaseAge: 1440

# Exclude trusted packages from age restriction
minimumReleaseAgeExclude:
  - '@zerodev/*'

# Acknowledged audit findings we cannot fix by bumping (verified 2026-07-08).
# All are pinned by upstream packages or have no patched release. Re-check when
# the named upstream moves; remove the entry once the finding no longer applies.
auditConfig:
  ignoreGhsas:
    # uuid v3/v5/v6 buffer bounds check (moderate), patched only in >=11.1.1.
    # Old majors pinned by xcode@3 (uuid ^7, via expo config tooling) and
    # @metamask/utils (uuid ^9) — even their latest releases still pin them.
    # Not exploitable here: requires the caller to pass `buf`, these parents don't.
    - GHSA-w5hq-g745-h8pq
    # postcss <8.5.10 XSS via unescaped </style> (moderate). next hard-pins
    # postcss@8.4.31 in every 15.5.x release; build-time only, processes our own CSS.
    - GHSA-qx2v-qp2m-jg93
    # elliptic risky crypto primitive (low). No patched release exists (advisory has
    # no fix version). Dev-only path: wallet-react-ui docs/build via
    # vite-plugin-node-polyfills -> crypto-browserify.
    - GHSA-848j-6mx2-7j84
    # decode-uri-component <0.5.0 DoS via malformed percent-encoded input (moderate).
    # Every expo-router release through 58.0.8 depends on query-string ^7.1.3, and
    # query-string 7.1.3 is the last 7.x and pins decode-uri-component ^0.2.2.
    # Only the expo-example app pulls it in. Remove this entry once expo-router
    # depends on query-string >=9.5.
    - GHSA-vcc3-ghjq-m6fr
